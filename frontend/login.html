<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfraRisk | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ROLE SELECTION */

        .role-label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .role-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 10px;
            border: 1px solid #d6dbe1;
            border-radius: 8px;
            background: #ffffff;
            color: #4b5563;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: center;
        }

        .role-option label:hover {
            border-color: #9aa4b2;
        }

        .role-option input:checked + label {
            border-color: #1f4f82;
            background: #eef5fc;
            color: #1f4f82;
            font-weight: 600;
        }

    </style>

</head>


<body class="login-page">


    <div class="login-container">


        <!-- LOGO -->

        <div class="login-logo">

            <div class="logo-symbol">
                IR
            </div>

            <h1>InfraRisk</h1>

            <p>
                Municipal Infrastructure Risk Management
            </p>

        </div>


        <!-- LOGIN HEADING -->

        <div class="login-heading">

            <h2>Officer Login</h2>

            <p>
                Sign in to access your dashboard
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form class="login-form" onsubmit="handleLogin(event)">


            <!-- USERNAME -->

            <label for="governmentID">
                Government ID
            </label>

            <input
                type="text"
                id="governmentID"
                placeholder="Enter your GovenmentID"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- ROLE -->

            <span class="role-label">
                Login As
            </span>


            <div class="role-selection">


                <div class="role-option">

                    <input
                        type="radio"
                        id="municipal"
                        name="role"
                        value="municipal"
                    >

                    <label for="municipal">
                        Municipal Officer
                    </label>

                </div>


                <div class="role-option">

                    <input
                        type="radio"
                        id="field"
                        name="role"
                        value="field"
                    >

                    <label for="field">
                        Field Inspector
                    </label>

                </div>


            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- FOOTER -->

        <div class="login-footer">

            <p>
                Municipal Infrastructure Management System
            </p>

            <span>
                © 2026 InfraRisk
            </span>

        </div>


    </div>


    <!-- LOGIN JAVASCRIPT -->

    <script>

        function handleLogin(event) {

            event.preventDefault();


            const selectedRole =
                document.querySelector('input[name="role"]:checked');


            if (!selectedRole) {

                alert("Please select your role.");

                return;

            }


            if (selectedRole.value === "municipal") {

                window.location.href = "dashboard.html";

            }


            else if (selectedRole.value === "field") {

                window.location.href = "field-inspector.html";

            }

        }

    </script>


</body>

</html>
