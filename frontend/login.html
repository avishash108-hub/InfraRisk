<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfraRisk | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <div class="login-container">


        <div class="login-logo">

            <div class="logo-symbol">
                IR
            </div>

            <h1>InfraRisk</h1>

            <p>
                Municipal Infrastructure Risk Management
            </p>

        </div>


        <div class="login-heading">

            <h2>Officer Login</h2>

            <p>
                Sign in to access the municipal dashboard
            </p>

        </div>


        <form class="login-form">


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


          <button
    type="button"
    class="login-button"
    onclick="window.location.href='dashboard.html'"
>
    Login
</button>

        </form>


        <div class="login-footer">

            <p>
                Municipal Infrastructure Management System
            </p>

            <span>
                © 2026 InfraRisk
            </span>

        </div>


    </div>


</body>

</html>
Displaying infrastructure_data.csv.
